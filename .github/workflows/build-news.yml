name: Build news.json from Markdown

on:
  push:
    paths:
      - '_news/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

            - name: Convert Markdown to JSON
        run: |
          python3 << 'EOF'
          import os, json, re

          news_dir = "_news"
          items = []

          for filename in sorted(os.listdir(news_dir)):
              if not filename.endswith(".md"):
                  continue
              path = os.path.join(news_dir, filename)
              with open(path, encoding="utf-8") as f:
                  content = f.read()

              match = re.match(r"^---\n(.*?)\n---\n(.*)$", content, re.DOTALL)
              if not match:
                  continue

              meta_raw, body = match.groups()
              meta = {}
              for line in meta_raw.split("\n"):
                  if ":" in line:
                      k, v = line.split(":", 1)
                      meta[k.strip()] = v.strip().strip('"').strip("'")

              html_body = "<p>" + body.strip().replace("\n\n", "</p><p>").replace("\n", "<br>") + "</p>"

              # Краткое описание (если не задано — берём первые 200 символов текста)
              excerpt = meta.get("excerpt", "").strip()
              if not excerpt:
                  plain = re.sub(r"<[^>]+>", "", html_body)
                  excerpt = plain[:200].strip() + ("…" if len(plain) > 200 else "")

              # Имя файла без .md — для ссылки на полную новость
              slug = filename.replace(".md", "")

              items.append({
                  "date": meta.get("date", ""),
                  "title": meta.get("title", ""),
                  "excerpt": excerpt,
                  "body": html_body,
                  "slug": slug
              })

          items.sort(key=lambda x: x["date"], reverse=True)

          with open("_news/news.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)

          print(f"Сгенерировано новостей: {len(items)}")
          EOF

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _news/news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update news.json"
          git push
