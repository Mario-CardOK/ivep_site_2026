backend:
  name: github
  repo: Mario-CardOK/ivep_site_2026
  branch: main
  base_url: https://ivep-auth.olegkretov078.workers.dev
  auth_endpoint: /auth

media_folder: "images/news"
public_folder: "/ivep_site_2026/images/news"

collections:
  - name: "news"
    label: "Новости"
    folder: "_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Обложка новости", name: "thumbnail", widget: "image", required: false }
      - { label: "Краткое описание (для превью)", name: "excerpt", widget: "text", required: false }
      - { label: "Полный текст новости", name: "body", widget: "markdown" }